<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts - Barangay Emergency Response</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-shield-alt"></i> Emergency System</h3>
            </div>
            <ul class="sidebar-menu" id="sidebarMenu">
                <!-- Menu will be loaded dynamically -->
            </ul>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h2>Emergency Contacts</h2>
                <div class="user-menu">
                    <span id="userName">Loading...</span>
                    <div class="user-avatar" id="userAvatar">U</div>
                </div>
            </div>

            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-phone-alt"></i> Important Emergency Hotlines</h3>
                    </div>
                    
                    <div style="margin-bottom: 30px;">
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn btn-outline" onclick="filterContacts('all')">All</button>
                            <button class="btn btn-outline" onclick="filterContacts('police')">Police</button>
                            <button class="btn btn-outline" onclick="filterContacts('fire')">Fire</button>
                            <button class="btn btn-outline" onclick="filterContacts('medical')">Medical</button>
                            <button class="btn btn-outline" onclick="filterContacts('rescue')">Rescue</button>
                            <button class="btn btn-outline" onclick="filterContacts('utility')">Utility</button>
                        </div>
                    </div>

                    <div id="contactsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                        <div class="text-center">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) {
            throw new Error('Not authenticated');
        }

        const user = getCurrentUser();
        let allContacts = [];

        function initPage() {
            document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
            document.getElementById('userAvatar').textContent = user.firstName.charAt(0).toUpperCase();

            loadSidebar();
            loadContacts();
        }

        function loadSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            
            if (user.role === 'admin') {
                sidebar.innerHTML = `
                    <li><a href="admin-dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="emergency-contacts.html" class="active"><i class="fas fa-phone"></i> Contacts</a></li>
                    <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                `;
            } else if (user.role === 'responder') {
                sidebar.innerHTML = `
                    <li><a href="responder-dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="emergency-contacts.html" class="active"><i class="fas fa-phone"></i> Contacts</a></li>
                    <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                `;
            } else {
                sidebar.innerHTML = `
                    <li><a href="citizen-dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="report-emergency.html"><i class="fas fa-exclamation-triangle"></i> Report Emergency</a></li>
                    <li><a href="my-emergencies.html"><i class="fas fa-list"></i> My Emergencies</a></li>
                    <li><a href="emergency-contacts.html" class="active"><i class="fas fa-phone"></i> Contacts</a></li>
                    <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                `;
            }
        }

        function loadContacts() {
            allContacts = JSON.parse(localStorage.getItem('emergencyContacts') || '[]');
            displayContacts(allContacts);
        }

        function displayContacts(contacts) {
            const grid = document.getElementById('contactsGrid');
            
            if (contacts.length === 0) {
                grid.innerHTML = '<p class="text-center">No contacts available</p>';
                return;
            }

            const typeIcons = {
                'police': 'fa-shield-alt',
                'fire': 'fa-fire',
                'medical': 'fa-ambulance',
                'rescue': 'fa-life-ring',
                'utility': 'fa-tools',
                'other': 'fa-phone'
            };

            const typeColors = {
                'police': '#3498db',
                'fire': '#e74c3c',
                'medical': '#e74c3c',
                'rescue': '#f39c12',
                'utility': '#95a5a6',
                'other': '#2c3e50'
            };

            grid.innerHTML = contacts.map(contact => `
                <div class="card" style="text-align: center;">
                    <div style="width: 80px; height: 80px; margin: 0 auto 15px; background: ${typeColors[contact.type] || '#2c3e50'}; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="fas ${typeIcons[contact.type] || 'fa-phone'}" style="font-size: 2rem; color: white;"></i>
                    </div>
                    <h3 style="margin-bottom: 5px;">${contact.name}</h3>
                    ${contact.organization ? `<p style="color: var(--gray); margin-bottom: 10px;">${contact.organization}</p>` : ''}
                    <p style="font-size: 1.5rem; font-weight: bold; color: ${typeColors[contact.type] || '#2c3e50'}; margin-bottom: 10px;">
                        ${contact.phone}
                    </p>
                    <div style="margin-top: 15px;">
                        <a href="tel:${contact.phone}" class="btn btn-primary btn-block">
                            <i class="fas fa-phone"></i> Call Now
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterContacts(type) {
            if (type === 'all') {
                displayContacts(allContacts);
            } else {
                const filtered = allContacts.filter(c => c.type === type);
                displayContacts(filtered);
            }
        }

        initPage();
    </script>
</body>
</html>
